services:
  test-viajero-api:
    build: ./backend
    container_name: test-viajero-api
    env_file:
      - ./backend/.env
    volumes:
      - viajero_data:/app/data
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.viajero.rule=Host(`viajero-api.joaquinvasquez.com`)"
      - "traefik.http.routers.viajero.entrypoints=websecure"
      - "traefik.http.routers.viajero.tls.certresolver=cloudflare"
      - "traefik.http.services.viajero.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.viajero-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.viajero-ratelimit.ratelimit.burst=20"
      - "traefik.http.routers.viajero.middlewares=viajero-ratelimit"
    restart: unless-stopped
volumes:
  viajero_data:
networks:
  web:
    external: true