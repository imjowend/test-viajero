services:
  test-viajero-api:
    build: ./backend
    container_name: test-viajero-api
    env_file:
      - ./backend/.env
    volumes:
      - viajero_data:/app/data
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.viajero-api.rule=Host(`viajero-api.joaquinvasquez.com`)"
      - "traefik.http.routers.viajero-api.entrypoints=websecure"
      - "traefik.http.routers.viajero-api.tls.certresolver=cloudflare"
      - "traefik.http.services.viajero-api.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.viajero-api-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.viajero-api-ratelimit.ratelimit.burst=20"
      - "traefik.http.middlewares.viajero-api-cors.headers.accesscontrolalloworiginlist=https://test-viajero.vercel.app"
      - "traefik.http.middlewares.viajero-api-cors.headers.accesscontrolallowmethods=GET,POST,OPTIONS"
      - "traefik.http.middlewares.viajero-api-cors.headers.accesscontrolallowheaders=Content-Type,Authorization"
      - "traefik.http.middlewares.viajero-api-cors.headers.accesscontrolmaxage=600"
      - "traefik.http.middlewares.viajero-api-cors.headers.addvaryheader=true"
      - "traefik.http.routers.viajero-api.middlewares=viajero-api-cors,viajero-api-ratelimit"
    restart: unless-stopped
volumes:
  viajero_data:
networks:
  web:
    external: true